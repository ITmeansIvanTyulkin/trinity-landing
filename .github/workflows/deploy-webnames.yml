# Production → Webnames FTP только с ветки main.
# Ветка dev — разработка и локальный просмотр, на хостинг не едет.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   FTP_HOST          — e.g. ftp.trinity.trading or host from Webnames panel
#   FTP_USER          — FTP login
#   FTP_PASSWORD      — FTP password
#   FTP_SERVER_DIR    — remote folder, must end with /  (often ./ or public_html/ or www/)
#   SUPABASE_URL      — https://….supabase.co  (writes js/cabinet-config.js before upload)
#   SUPABASE_ANON_KEY — anon public key

name: Deploy Webnames

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-webnames
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP sync (main → Webnames)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write cabinet-config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY empty — uploading repo placeholder cabinet-config.js"
            exit 0
          fi
          python3 <<'PY'
          import json, os, pathlib
          url = os.environ["SUPABASE_URL"].strip()
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          body = (
              "/* Generated by GitHub Actions deploy — do not edit on the server. */\n"
              "window.CABINET_CONFIG = {\n"
              f"  supabaseUrl: {json.dumps(url)},\n"
              f"  supabaseAnonKey: {json.dumps(key)},\n"
              "  supportEmail: \"info@trinity.trading\",\n"
              "};\n"
          )
          pathlib.Path("js/cabinet-config.js").write_text(body, encoding="utf-8")
          print("Wrote js/cabinet-config.js")
          PY

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Webnames usually wants FTPS. If upload fails on TLS, set secret FTP_PROTOCOL=ftp
          # and change this line to: ${{ secrets.FTP_PROTOCOL }}
          protocol: ftps
          # Remote site root from Webnames panel (often ./ or public_html/ or www/) — trailing slash required
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.cursor/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            **/.env
            **/.env.*
            **/js/cabinet-config.local.js
            **/test/**
            **/docs/**
            **/supabase/**
            **/scripts/**
            **/agent-transcripts/**
            **/*.md
            **/.gitignore
            **/package.json
            **/package-lock.json
            **/trinity-landing-deploy.zip
            **/.idea/**
            **/.vscode/**
